<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<meta name="mobile-web-app-capable" content="yes">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9edf0; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#16202a; --muted:#5d6b78; --line:#d3dae0;
  --accent:#1f5fbf; --accent-ink:#ffffff; --good:#2e9e5b; --bad:#d7263d; --warn:#c98f00;
  --p25:#d7263d; --p20:#1f5fbf; --p15:#f2b705; --p10:#2e9e5b; --p5:#f7f7f7; --p5b:#9aa4ad; --psmall:#3a434b;
  --shadow:0 1px 0 rgba(22,32,42,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171c; --surface:#1a2229; --surface-2:#212b33; --ink:#e8edf1; --muted:#95a3af; --line:#2c3842;
    --accent:#4a86e8; --accent-ink:#0b1320; --good:#45c07c; --bad:#ff5a6e; --warn:#f2b705;
    --p5:#e8edf1; --p5b:#6d7a86; --psmall:#b8c2cb; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#1a2229; --surface-2:#212b33; --ink:#e8edf1; --muted:#95a3af; --line:#2c3842;
  --accent:#4a86e8; --accent-ink:#0b1320; --good:#45c07c; --bad:#ff5a6e; --warn:#f2b705;
  --p5:#e8edf1; --p5b:#6d7a86; --psmall:#b8c2cb; --shadow:none;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;padding:0 14px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.titlebar h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;letter-spacing:.2px}
.weekinfo{color:var(--muted);font-size:14px;text-align:right}
.weekinfo b{color:var(--ink);font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0 5px;text-align:center;font-size:13px;color:var(--muted)}
.day b{display:block;font-size:15px;color:var(--ink);font-weight:600}
.day .dot{display:block;height:4px;width:18px;margin:4px auto 0;border-radius:2px;background:transparent}
.day.lift .dot{background:var(--p25)}
.day.run .dot{background:var(--p10)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-pressed="true"] b,.day[aria-pressed="true"]{color:var(--bg)}
.day.today b::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:3px;vertical-align:middle}

.banner{margin:10px 0 4px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border-left:4px solid var(--warn);font-size:14px}

.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px}
.dayhead h2{margin:0;font-size:20px;font-weight:600}
.dayhead span{color:var(--muted);font-size:14px}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;margin-bottom:10px;box-shadow:var(--shadow)}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.thumb{flex:0 0 64px;width:64px;height:64px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:40px;height:40px;color:var(--muted)}
.ex-head{display:flex;gap:12px;align-items:flex-start;flex:1;min-width:0}
.slot{width:100%;aspect-ratio:4/3;max-height:240px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot .ph{text-align:center;color:var(--muted);font-size:14px;padding:12px}
.slot svg{width:150px;height:150px;display:block;margin:0 auto 4px;color:var(--ink)}
.ex-name{font-weight:600;font-size:16px}
.ex-scheme{color:var(--muted);font-size:14px}
.ex-note{color:var(--muted);font-size:13px;margin-top:2px}
.edit{border:0;background:transparent;color:var(--muted);padding:4px 6px;border-radius:8px;font-size:14px}
.ex-mid{display:flex;align-items:center;gap:14px;margin:6px 0 8px}
.kg{font-size:44px;font-weight:700;line-height:1;letter-spacing:-.5px}
.kg small{font-size:17px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.delta{font-size:13px;color:var(--muted)}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}

.bar{display:flex;align-items:center;height:44px;flex:1;min-width:0}
.bar .sleeve{height:6px;width:14px;background:var(--p5b);border-radius:1px}
.bar .collar{height:14px;width:4px;background:var(--p5b);border-radius:1px;margin-right:2px}
.plate{width:8px;margin-right:2px;border-radius:2px}
.plate.p25{height:42px;background:var(--p25)}
.plate.p20{height:42px;background:var(--p20)}
.plate.p15{height:36px;background:var(--p15)}
.plate.p10{height:30px;background:var(--p10)}
.plate.p5{height:22px;background:var(--p5);border:1px solid var(--p5b)}
.plate.p2_5,.plate.p1_25{width:5px;background:var(--psmall)}
.plate.p2_5{height:17px}.plate.p1_25{height:13px}
.bar .end{height:6px;flex:0 0 10px;background:var(--p5b);border-radius:0 2px 2px 0}
.bar-label{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:6px}

.sets{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.set{min-width:44px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;font-weight:600;padding:0 8px}
.set.done{background:var(--good);border-color:var(--good);color:#fff}
.set.miss{background:transparent;border-color:var(--bad);color:var(--bad);text-decoration:line-through}

.decide{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.decide button{border:0;background:transparent;padding:8px 4px;font-size:14px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.decide button:last-child{border-right:0}
.decide button[aria-pressed="true"][data-d="up"]{background:var(--good);color:#fff}
.decide button[aria-pressed="true"][data-d="hold"]{background:var(--ink);color:var(--bg)}
.decide button[aria-pressed="true"][data-d="back"]{background:var(--bad);color:#fff}

.run{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--p10);border-radius:14px;padding:14px;margin-bottom:10px}
.run h3{margin:0 0 4px;font-size:17px}
.run p{margin:0 0 12px;font-size:20px;font-weight:600}
.rest{padding:28px 14px;text-align:center;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.block{width:100%}
.btn.toggle[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stack>*+*{margin-top:8px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:transparent;padding:12px 4px 13px;font-weight:600;font-size:15px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:17px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.stepper .ctl{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:20px}
.stepper output{min-width:36px;text-align:center;font-size:24px;font-weight:700}
.muted{color:var(--muted);font-size:13px}

table.prog{width:100%;border-collapse:collapse;font-size:15px}
table.prog th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:6px 4px;border-bottom:1px solid var(--line)}
table.prog td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.prog td.r,table.prog th.r{text-align:right}
.spark{display:block}
.tablewrap{overflow-x:auto}

.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 12px;font-size:19px}
.sheet .changes{margin:0 0 14px;padding:0;list-style:none}
.sheet .changes li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
.sync{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>

<div class="app" id="app"></div>
<nav class="tabs"><div class="inner">
  <button data-tab="train">Train</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="setup">Setup</button>
</div></nav>
<div id="overlay"></div>
<script>
(function(){
"use strict";
const KEY = "lift-log-v1";
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const LIFTS = {squat:"Squat",bench:"Bench",deadlift:"Deadlift",ohp:"Overhead press"};
const EQUIP = {bar:"Barbell",db:"Dumbbells (per hand)",machine:"Machine / cable",plates:"Plates only",bw:"Bodyweight"};
const MAIN = ["bench","deadlift","squat","ohp","closegrip"];
const ICONS = {bench:"Bench press",incline:"Incline press",ohp:"Overhead press",seateddb:"Seated press",squat:"Squat",legpress:"Leg press",deadlift:"Deadlift",rdl:"Romanian deadlift",row:"Barbell row",tbar:"Chest-supported row",pulldown:"Lat pulldown",chinup:"Chin-up",curl:"Barbell curl",hammer:"Hammer curl",pushdown:"Triceps pushdown",ohtri:"Overhead extension",lateral:"Lateral raise",reardelt:"Rear delt fly",facepull:"Face pull",fly:"Dumbbell fly",calf:"Calf raise",plank:"Plank",hlr:"Hanging leg raise",run:"Running"};

// Photos are kept in their own localStorage key, not in the saved programme.
// A few images would blow past the size limit of the account sync and of a
// backup file, so they stay on the device that took them.
const PKEY = "lift-log-photos-v1";
let photos = {};
try{ photos = JSON.parse(localStorage.getItem(PKEY)||"{}"); }catch(e){ photos = {}; }
function savePhotos(){ try{ localStorage.setItem(PKEY, JSON.stringify(photos)); }catch(e){ toast("No room left for more photos"); } }
// Shrinks an upload before storing it. Phone photos are several MB and
// localStorage holds only a few, so anything bigger is wasted.
function shrink(file, cb){
  const img = new Image();
  img.onload = ()=>{
    const max = 640, scale = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    cb(c.toDataURL("image/jpeg", 0.72));
  };
  img.onerror = ()=>{ URL.revokeObjectURL(img.src); toast("Could not read that image"); };
  img.src = URL.createObjectURL(file);
}
function thumbFor(e, cls){
  const p = photos[e.id];
  if(p) return `<div class="${cls}"><img src="${p}" alt=""></div>`;
  return `<div class="${cls}"><svg aria-hidden="true"><use href="#g-${e.icon||"press"}"/></svg></div>`;
}

const RUNS = [
  {to:4,  easy:"20–25 min at 7 km/t",   q:"8 × 90 s at 8 km/t, 90 s walk between"},
  {to:8,  easy:"25–30 min at 7,5 km/t", q:"6 × 3 min at 8,5 km/t, 2 min walk between"},
  {to:14, easy:"30–40 min at 8 km/t",   q:"5 × 3 min at 10 km/t, 2 min jog between"},
  {to:20, easy:"30–40 min at 8,5 km/t", q:"Odd weeks: 5 × 3 min at 10 km/t. Even weeks: 15–20 min at 9,5 km/t"},
  {to:28, easy:"30–40 min at 9 km/t",   q:"5 × 1000 m at 12 km/t, 2 min rest"},
  {to:999,easy:"30–40 min at 9 km/t",   q:"Odd weeks: 5 × 1000 m at 12 km/t. Even weeks: 20 min at 11 km/t"}
];
const TEST_WEEKS = [8,20,32];

function ex(id, day, name, sets, reps, equip, base, inc, round, note, icon){
  return {id, day, name, sets, reps:String(reps), equip, base, inc, round, note:note||"", icon:icon||"press", offset:0, decision:"up"};
}
function defaults(){
  const P=(lift,pct)=>({type:"pct",lift,pct}), F=kg=>({type:"fixed",kg});
  const list = [
    ex("bench",0,"Bench press",4,5,"bar",P("bench",76.8),2.5,2.5,"","bench"),
    ex("deadlift",0,"Deadlift",3,4,"bar",P("deadlift",77.5),5,2.5,"","deadlift"),
    ex("inclinedb",0,"Incline dumbbell press",3,8,"db",F(30),2,0.5,"","incline"),
    ex("row",0,"Barbell row",4,8,"bar",F(80),2.5,2.5,"","row"),
    ex("pulldown",0,"Lat pulldown",3,10,"machine",F(60),2.5,2.5,"Bar to upper chest, torso near vertical","pulldown"),
    ex("tbar",0,"Chest-supported row (Nautilus)",3,12,"plates",F(40),5,2.5,"Plates only. Calibrate to 12 strict reps at RPE 8","tbar"),
    ex("facepull",0,"Face pull",3,15,"machine",F(22.5),2.5,2.5,"","facepull"),
    ex("fly",0,"Dumbbell fly",2,15,"db",F(12),2,0.5,"","fly"),
    ex("squat",2,"Back squat",4,5,"bar",P("squat",77.6),5,2.5,"","squat"),
    ex("ohp",2,"Overhead press",4,5,"bar",P("ohp",80),2.5,2.5,"","ohp"),
    ex("rdl",2,"Romanian deadlift",3,8,"bar",P("deadlift",50),5,2.5,"","rdl"),
    ex("legpress",2,"Leg press",3,10,"machine",F(180),10,2.5,"","legpress"),
    ex("seateddb",2,"Seated dumbbell press",3,10,"db",F(27.5),2.5,0.5,"","seateddb"),
    ex("lateral",2,"Lateral raise",3,15,"db",F(8),1,0.5,"","lateral"),
    ex("reardelt",2,"Rear delt fly",3,15,"db",F(9),1,0.5,"","reardelt"),
    ex("calf",2,"Standing calf raise",3,12,"machine",F(100),5,2.5,"","calf"),
    ex("hlr",2,"Hanging leg raise",3,10,"bw",F(0),0,0.5,"","hlr"),
    ex("closegrip",4,"Close grip bench",3,6,"bar",P("bench",62.5),2.5,2.5,"6RM is about 101 kg, keep 3 × 6 below it","bench"),
    ex("chinup",4,"Chin-up",4,"max","bw",F(0),0,0.5,"","chinup"),
    ex("ez",4,"EZ curl",3,10,"bar",F(36.5),2.5,1.25,"Titan Life EZ bar is 9 kg, weight shown includes it","curl"),
    ex("ohtri",4,"Overhead triceps extension",3,12,"machine",F(25),2.5,2.5,"","ohtri"),
    ex("hammer",4,"Hammer curl",3,12,"db",F(15),1,0.5,"","hammer"),
    ex("pushdown",4,"Triceps pushdown",3,12,"machine",F(40),2.5,2.5,"","pushdown"),
    ex("inclinecurl",4,"Incline dumbbell curl",2,15,"db",F(9),1,0.5,"","curl"),
    ex("reardeltcable",4,"Rear delt cable",2,15,"machine",F(8),1,0.5,"","reardelt"),
    ex("plank",4,"Plank",3,"30–45 s","bw",F(0),0,0.5,"","plank")
  ];
  list.find(e=>e.id==="ez").plates=false;
  return {
    v:1, updatedAt:Date.now(),
    maxes:{squat:190,bench:140,deadlift:200,ohp:100},
    block:1, week:1, runWeek:1,
    dayTypes:["lift","easy","lift","easy","lift","quality","rest"],
    exercises:list,
    runs:JSON.parse(JSON.stringify(RUNS)),
    log:{}, runLog:{}, history:{}
  };
}

let state = load();
let ui = {tab:"train", day:todayIdx()};
let dbRef = null, dbTimer = null, syncNote = "Saved on this phone";

function todayIdx(){ const d=new Date().getDay(); return d===0?6:d-1; }
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); if(s && s.v===1) return migrate(s); } }catch(e){}
  return defaults();
}
// Upgrades an existing saved programme in place. Logs, history and any exercise
// the user edited themselves are left alone, so an update never costs data.
function migrate(s){
  if(!s.mig2){
    const t=(s.exercises||[]).find(e=>e.id==="tbar");
    if(t && t.base && t.base.type==="fixed" && Number(t.base.kg)===50){
      t.name="Chest-supported row (Nautilus)";
      t.base.kg=40;
      t.note="Plates only. Calibrate to 12 strict reps at RPE 8";
    }
    s.mig2=true;
  }
  // Older saves had the running phases baked into the code, so copy them in
  // once. Without this the run days would have nothing to read or edit.
  if(!Array.isArray(s.runs)) s.runs = JSON.parse(JSON.stringify(RUNS));
  if(!s.mig4){
    const d4=defaults();
    (s.exercises||[]).forEach(e=>{ const o=d4.exercises.find(x=>x.id===e.id); if(o) e.icon=o.icon; });
    s.mig4=true;
  }
  if(!s.mig3){
    const d=defaults();
    (s.exercises||[]).forEach(e=>{ if(!e.icon){ const o=d.exercises.find(x=>x.id===e.id); e.icon=o?o.icon:"press"; } });
    s.mig3=true;
  }
  return s;
}
function save(){
  state.updatedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  if(dbRef){ clearTimeout(dbTimer); dbTimer=setTimeout(pushRemote,1200); }
}
async function pushRemote(){
  if(!dbRef) return;
  try{ await dbRef.set({json:JSON.stringify(state), updatedAt:state.updatedAt}); syncNote="Synced to your Claude account"; }
  catch(e){ syncNote="Saved on this phone (sync paused)"; }
  if(ui.tab==="setup") render();
}
async function initSync(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    dbRef = db.doc("data/users/"+uid+"/state");
    const snap = await dbRef.get();
    const remote = snap.exists ? snap.data() : null;
    if(remote && remote.json && Number(remote.updatedAt) > Number(state.updatedAt||0)){
      const s = JSON.parse(remote.json);
      if(s && s.v===1){ state=s; try{localStorage.setItem(KEY, remote.json);}catch(e){} }
      syncNote="Synced to your Claude account"; render();
    } else { await pushRemote(); }
  }catch(e){ dbRef=null; }
}

/* ---------- weight maths ---------- */
function rnd(x, step){ step=step||2.5; return Math.round(x/step)*step; }
function baseKg(e){
  if(e.base.type==="pct") return rnd(state.maxes[e.base.lift]*e.base.pct/100, e.round);
  return Number(e.base.kg)||0;
}
function curKg(e){ return rnd(baseKg(e)+(e.offset||0), e.round); }
const isDeload = ()=>state.week===5;
function shownKg(e){ const k=curKg(e); return isDeload()? rnd(k*0.82, e.round) : k; }
function shownSets(e){ return isDeload()? (MAIN.includes(e.id)?3:Math.min(2,e.sets)) : e.sets; }
function nextKg(e){
  const k=curKg(e);
  if(e.decision==="up") return rnd(k+(e.inc||0), e.round);
  if(e.decision==="back") return rnd(k*0.9, e.round);
  return k;
}
function fmt(n){ return (Math.round(n*100)/100).toString().replace(".",","); }
function unitOf(e){ return e.equip==="db"?"kg/hand":e.equip==="plates"?"kg plates":"kg"; }
function platesPerSide(total){
  let side=(total-20)/2; const out=[];
  if(side<=0) return out;
  for(const p of [25,20,15,10,5,2.5,1.25]){ while(side>=p-1e-9){ out.push(p); side-=p; } }
  return out;
}
function runFor(w){ const rs=state.runs||RUNS; return rs.find(r=>w<=r.to) || rs[rs.length-1] || RUNS[RUNS.length-1]; }
function runIdx(w){ const rs=state.runs||RUNS; const i=rs.findIndex(r=>w<=r.to); return i<0?rs.length-1:i; }

/* ---------- rendering ---------- */
const app = document.getElementById("app");
const overlay = document.getElementById("overlay");
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    if(b.dataset.tab===ui.tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  if(ui.tab==="train") app.innerHTML = trainView();
  else if(ui.tab==="progress") app.innerHTML = progressView();
  else app.innerHTML = setupView();
}

function header(){
  const today=todayIdx();
  const days = DAYS.map((d,i)=>{
    const t=state.dayTypes[i]; const cls=t==="lift"?"lift":(t==="easy"||t==="quality")?"run":"";
    return `<button class="day ${cls} ${i===today?"today":""}" data-day="${i}" aria-pressed="${i===ui.day}"><b>${d}</b><span class="dot"></span></button>`;
  }).join("");
  return `<header class="top">
    <div class="titlebar"><h1>Lift Log</h1>
      <div class="weekinfo">Block ${state.block}, week <b>${state.week}</b> of 5<br>Run week <b>${state.runWeek}</b></div>
    </div>
    <div class="days">${days}</div>
  </header>`;
}

function trainView(){
  let h = header();
  if(isDeload()) h += `<div class="banner">Deload week. Weights are about 82% of your current numbers, fewer sets. No progression decisions this week.</div>`;
  if(TEST_WEEKS.includes(state.runWeek)) h += `<div class="banner">5k test at the end of this week.</div>`;
  const t = state.dayTypes[ui.day];
  const dayName = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][ui.day];
  if(t==="lift"){
    const list = state.exercises.filter(e=>e.day===ui.day);
    h += `<div class="dayhead"><h2>${dayName}</h2><span>${list.length} exercises</span></div>`;
    h += list.map(exCard).join("");
    h += `<div class="stack"><button class="btn block" data-act="add">Add exercise</button></div>`;
  } else if(t==="easy"||t==="quality"){
    const r = runFor(state.runWeek); const key=state.runWeek+"-"+ui.day; const done=!!state.runLog[key];
    h += `<div class="dayhead"><h2>${dayName}</h2><span>${t==="easy"?"Easy run":"Quality run"}</span></div>
      <div class="run"><div class="ex-top"><h3 style="margin:0">${t==="easy"?"Easy, conversational pace":"Intervals"}</h3>
      <button class="edit" data-act="editrun" data-run="${runIdx(state.runWeek)}">Edit</button></div>
      <p>${esc(t==="easy"?r.easy:r.q)}</p>
      <div class="muted" style="margin:-4px 0 12px">${t==="easy"?"If you cannot speak a full sentence, slow down.":"10 min easy jog warmup, 5 min walk cooldown."}</div>
      <button class="btn toggle block" data-act="rundone" aria-pressed="${done}">${done?"Done":"Mark as done"}</button></div>`;
  } else {
    h += `<div class="dayhead"><h2>${dayName}</h2><span>Rest</span></div><div class="card rest">Rest day. Nothing scheduled.</div>`;
  }
  h += `<div style="margin-top:18px"><button class="btn primary block" data-act="finish">${isDeload()?"Finish deload and start new block":"Finish week "+state.week}</button></div>`;
  return h;
}

function exCard(e){
  const kg = shownKg(e), sets = shownSets(e);
  const logKey = state.block+"-"+state.week;
  const marks = ((state.log[logKey]||{})[e.id]) || [];
  let chips=""; for(let i=0;i<sets;i++){ const m=marks[i]||0; chips+=`<button class="set ${m===1?"done":m===2?"miss":""}" data-set="${i}" data-ex="${e.id}" aria-label="Set ${i+1}">${esc(e.reps)}</button>`; }
  let weight;
  if(e.equip==="bw") weight = `<div class="kg num" style="font-size:30px">Bodyweight</div>`;
  else {
    const nk = nextKg(e), diff = nk - curKg(e);
    const d = isDeload()? "" : diff>0?`<div class="delta up">Next week ${fmt(nk)}</div>`: diff<0?`<div class="delta down">Next week ${fmt(nk)}</div>`:`<div class="delta">Next week same</div>`;
    let bar="";
    if(e.equip==="bar" && e.plates!==false && kg>20){
      const ps=platesPerSide(kg);
      bar = `<div class="bar" aria-label="Plates per side: ${ps.map(fmt).join(", ")}"><span class="sleeve"></span><span class="collar"></span>${ps.map(p=>`<span class="plate p${String(p).replace(".","_")}"></span>`).join("")}<span class="end"></span><span class="bar-label">${ps.map(fmt).join(" + ")} per side</span></div>`;
    }
    weight = `<div><div class="kg num">${fmt(kg)}<small>${unitOf(e)}</small></div>${d}</div>${bar}`;
  }
  const dec = isDeload()||e.equip==="bw" ? "" :
    `<div class="decide" role="group" aria-label="Next week">
      <button data-dec="up" data-d="up" data-ex="${e.id}" aria-pressed="${e.decision==="up"}">Increase</button>
      <button data-dec="hold" data-d="hold" data-ex="${e.id}" aria-pressed="${e.decision==="hold"}">Stall</button>
      <button data-dec="back" data-d="back" data-ex="${e.id}" aria-pressed="${e.decision==="back"}">Fall back</button>
    </div>`;
  return `<article class="ex">
    <div class="ex-top"><div><div class="ex-name">${esc(e.name)}</div><div class="ex-scheme">${sets} × ${esc(e.reps)}</div>${e.note?`<div class="ex-note">${esc(e.note)}</div>`:""}</div>
    <div style="display:flex;gap:2px;flex:0 0 auto"><button class="edit" data-act="preview" data-ex="${e.id}">Preview</button>
    <button class="edit" data-act="edit" data-ex="${e.id}">Edit</button></div></div>
    <div class="ex-mid">${weight}</div>
    <div class="sets">${chips}</div>${dec}</article>`;
}

function spark(points){
  if(points.length<2) return "";
  const w=90,h=26,min=Math.min(...points),max=Math.max(...points),span=(max-min)||1;
  const d=points.map((p,i)=>`${(i/(points.length-1)*w).toFixed(1)},${(h-2-(p-min)/span*(h-4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${d}"/></svg>`;
}
function progressView(){
  const rows = state.exercises.filter(e=>e.equip!=="bw").map(e=>{
    const hist=(state.history[e.id]||[]).map(x=>x.kg);
    const start=hist.length?hist[0]:curKg(e);
    const diff=curKg(e)-start;
    return `<tr><td>${esc(e.name)}<div class="muted">${DAYS[e.day]}</div></td><td>${spark(hist.concat([curKg(e)]))}</td>
      <td class="r num" style="font-size:20px;font-weight:700">${fmt(curKg(e))}</td>
      <td class="r ${diff>0?"delta up":diff<0?"delta down":"delta"}">${diff>0?"+":""}${diff?fmt(diff):"–"}</td></tr>`;
  }).join("");
  const runs = Object.keys(state.runLog).filter(k=>state.runLog[k]).length;
  return `<header class="top"><div class="titlebar"><h1>Progress</h1><div class="weekinfo">${runs} runs logged</div></div></header>
    <div class="card"><h3>Estimated 1RM</h3>
      <table class="prog"><tbody>${Object.keys(LIFTS).map(k=>`<tr><td>${LIFTS[k]}</td><td class="r num" style="font-size:22px;font-weight:700">${fmt(state.maxes[k])} kg</td></tr>`).join("")}</tbody></table>
      <div class="muted" style="margin-top:8px">Total ${fmt(state.maxes.squat+state.maxes.bench+state.maxes.deadlift)} kg</div></div>
    <div class="card"><h3>Current working weights</h3><div class="tablewrap"><table class="prog">
      <thead><tr><th>Exercise</th><th>Trend</th><th class="r">Now</th><th class="r">Change</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="muted" style="margin-top:8px">Change is measured from the first finished week of this block.</div></div>`;
}

function stepper(label, key, min, max){
  return `<div class="stepper"><span>${label}</span><div class="ctl">
    <button data-step="${key}" data-by="-1" data-min="${min}" data-max="${max}" aria-label="Decrease ${label}">−</button>
    <output class="num">${state[key]}</output>
    <button data-step="${key}" data-by="1" data-min="${min}" data-max="${max}" aria-label="Increase ${label}">+</button></div></div>`;
}
function setupView(){
  const dayType = i=>`<label class="f">${DAYS[i]}<select data-daytype="${i}">
    ${[["lift","Lifting"],["easy","Easy run"],["quality","Quality run"],["rest","Rest"]].map(([v,t])=>`<option value="${v}" ${state.dayTypes[i]===v?"selected":""}>${t}</option>`).join("")}</select></label>`;
  return `<header class="top"><div class="titlebar"><h1>Setup</h1><div class="weekinfo sync">${esc(syncNote)}</div></div></header>
  <div class="card"><h3>One rep maxes</h3>
    <div class="grid2">${Object.keys(LIFTS).map(k=>`<label class="f">${LIFTS[k]} (kg)<input type="number" inputmode="decimal" step="2.5" min="0" data-max="${k}" value="${state.maxes[k]}"></label>`).join("")}</div>
    <div class="muted">Main lifts, close grip and RDL recalculate from these. Accessories use fixed weights.</div></div>
  <div class="card"><h3>Where you are</h3>
    ${stepper("Block week","week",1,5)}${stepper("Run week","runWeek",1,36)}${stepper("Block","block",1,99)}</div>
  <div class="card"><h3>Running plan</h3>
    ${(state.runs||RUNS).map((r,i)=>`<div class="stepper" style="align-items:flex-start;gap:10px">
      <div style="flex:1"><b>Up to run week ${r.to}</b><div class="muted">Easy: ${esc(r.easy)}</div><div class="muted">Quality: ${esc(r.q)}</div></div>
      <button class="edit" data-act="editrun" data-run="${i}">Edit</button></div>`).join("")}
    <button class="btn block" data-act="addrun" style="margin-top:8px">Add phase</button></div>
  <div class="card"><h3>Weekly schedule</h3><div class="grid2">${DAYS.map((_,i)=>dayType(i)).join("")}</div></div>
  <div class="card stack"><h3>New block</h3>
    <div class="muted">After a retest: update your maxes above, then start again at week 1. Clears all Increase and Fall back adjustments.</div>
    <button class="btn block" data-act="newblock">Start new block</button></div>
  <div class="card stack"><h3>Backup</h3>
    <div class="row"><button class="btn" data-act="export">Export</button><button class="btn" data-act="import">Import</button></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <button class="btn danger block" data-act="reset">Reset to original programme</button></div>`;
}

/* ---------- sheets ---------- */
function openSheet(html){ overlay.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; const f=overlay.querySelector("input,select,button:not([data-act=close])"); if(f) f.focus(); }
function closeSheet(){ overlay.innerHTML=""; }
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

function editSheet(e, isNew){
  const pct = e.base.type==="pct";
  openSheet(`<h3>${isNew?"Add exercise":"Edit exercise"}</h3>
    <form id="exForm">
    <label class="f">Name<input name="name" required value="${esc(e.name)}"></label>
    <div class="grid2">
      <label class="f">Sets<input name="sets" type="number" inputmode="numeric" min="1" max="10" value="${e.sets}"></label>
      <label class="f">Reps<input name="reps" value="${esc(e.reps)}"></label>
      <label class="f">Day<select name="day">${DAYS.map((d,i)=>`<option value="${i}" ${e.day===i?"selected":""}>${d}</option>`).join("")}</select></label>
      <label class="f">Equipment<select name="equip">${Object.keys(EQUIP).map(k=>`<option value="${k}" ${e.equip===k?"selected":""}>${EQUIP[k]}</option>`).join("")}</select></label>
      <label class="f">Weight from<select name="btype"><option value="fixed" ${!pct?"selected":""}>Fixed kg</option><option value="pct" ${pct?"selected":""}>% of a 1RM</option></select></label>
      <label class="f">${pct?"1RM lift":"Start weight (kg)"}${pct?`<select name="lift">${Object.keys(LIFTS).map(k=>`<option value="${k}" ${e.base.lift===k?"selected":""}>${LIFTS[k]}</option>`).join("")}</select>`:`<input name="kg" type="number" inputmode="decimal" step="0.5" value="${e.base.kg??0}">`}</label>
      ${pct?`<label class="f">Percent<input name="pct" type="number" inputmode="decimal" step="0.5" value="${e.base.pct}"></label>`:""}
      <label class="f">Weekly increase (kg)<input name="inc" type="number" inputmode="decimal" step="0.5" value="${e.inc}"></label>
      <label class="f">Round to (kg)<input name="round" type="number" inputmode="decimal" step="0.25" min="0.25" value="${e.round}"></label>
      <label class="f">Illustration<select name="icon">${Object.keys(ICONS).map(k=>`<option value="${k}" ${(e.icon||"press")===k?"selected":""}>${ICONS[k]}</option>`).join("")}</select></label>
    </div>
    <label class="f">Note<input name="note" value="${esc(e.note||"")}"></label>
    ${!isNew?`<div class="muted" style="margin:-2px 0 12px">Current adjustment from Increase / Fall back: ${e.offset>0?"+":""}${fmt(e.offset||0)} kg</div>`:""}
    <div class="stack">
      <button class="btn primary block" type="submit">${isNew?"Add exercise":"Save changes"}</button>
      ${!isNew?`<div class="row"><button class="btn" type="button" data-act="resetoffset" data-ex="${e.id}">Reset adjustment</button><button class="btn danger" type="button" data-act="delete" data-ex="${e.id}">Delete</button></div>`:""}
      <button class="btn block" type="button" data-act="close">Cancel</button>
    </div></form>`);
  const form = overlay.querySelector("#exForm");
  form.btype.addEventListener("change",()=>{ const d=readForm(form,e); d.base = form.btype.value==="pct"?{type:"pct",lift:"bench",pct:70}:{type:"fixed",kg:curKg(e)||20}; editSheet(d,isNew); });
  form.addEventListener("submit",ev=>{
    ev.preventDefault();
    const d = readForm(form,e);
    if(isNew){ state.exercises.push(d); } else { const i=state.exercises.findIndex(x=>x.id===e.id); state.exercises[i]=d; }
    ui.day = d.day; save(); closeSheet(); render(); toast(isNew?"Exercise added":"Changes saved");
  });
}
function readForm(f, e){
  const n = Object.assign({}, e);
  n.name = f.name.value.trim()||"Exercise";
  n.sets = Math.max(1, Math.min(10, parseInt(f.sets.value)||3));
  n.reps = f.reps.value.trim()||"10";
  n.day = parseInt(f.day.value);
  n.equip = f.equip.value;
  n.inc = parseFloat(f.inc.value)||0;
  n.round = parseFloat(f.round.value)||2.5;
  n.note = f.note.value.trim();
  if(f.icon) n.icon = f.icon.value;
  if(f.btype.value==="pct" && f.lift){ n.base={type:"pct",lift:f.lift.value,pct:parseFloat(f.pct.value)||70}; }
  else if(f.kg){ n.base={type:"fixed",kg:parseFloat(f.kg.value)||0}; }
  return n;
}

function previewSheet(id){
  const e = state.exercises.find(x=>x.id===id); if(!e) return;
  const p = photos[e.id];
  const slot = p ? `<div class="slot"><img src="${p}" alt="${esc(e.name)}"></div>`
    : `<div class="slot"><div class="ph"><svg aria-hidden="true"><use href="#g-${e.icon||"press"}"/></svg>No photo yet<br>Add one from the gym</div></div>`;
  openSheet(`<h3>${esc(e.name)}</h3>
    ${slot}
    <div class="muted" style="margin-bottom:12px">${e.sets} × ${esc(e.reps)}${e.note?" &middot; "+esc(e.note):""}</div>
    <input type="file" id="photoFile" data-ex="${e.id}" accept="image/*" hidden>
    <div class="stack">
      <button class="btn primary block" data-act="pickphoto" data-ex="${e.id}">${p?"Replace photo":"Add photo"}</button>
      ${p?`<button class="btn danger block" data-act="rmphoto" data-ex="${e.id}">Remove photo</button>`:""}
      <button class="btn block" data-act="close">Close</button></div>`);
}

function runSheet(i, isNew){
  const rs = state.runs || (state.runs = JSON.parse(JSON.stringify(RUNS)));
  const r = isNew ? {to:(rs.length?rs[rs.length-1].to+4:4), easy:"", q:""} : rs[i];
  openSheet(`<h3>${isNew?"Add running phase":"Edit running phase"}</h3>
    <form id="runForm">
    <label class="f">Phase runs until run week<input name="to" type="number" inputmode="numeric" min="1" max="999" value="${r.to}"></label>
    <label class="f">Easy run (Tue, Thu)<input name="easy" value="${esc(r.easy)}"></label>
    <label class="f">Quality run (Sat)<input name="q" value="${esc(r.q)}"></label>
    <div class="muted" style="margin:-4px 0 12px">You are on run week ${state.runWeek}. Phases apply in order, each up to its last week.</div>
    <div class="stack"><button class="btn primary block" type="submit">${isNew?"Add phase":"Save phase"}</button>
      ${!isNew&&rs.length>1?`<button class="btn danger block" type="button" data-act="delrun" data-run="${i}">Delete phase</button>`:""}
      <button class="btn block" type="button" data-act="close">Cancel</button></div></form>`);
  overlay.querySelector("#runForm").addEventListener("submit",ev=>{
    ev.preventDefault();
    const f=ev.target;
    const o={to:Math.max(1,parseInt(f.to.value)||1), easy:f.easy.value.trim()||"Easy run", q:f.q.value.trim()||"Intervals"};
    if(isNew) rs.push(o); else rs[i]=o;
    rs.sort((a,b)=>a.to-b.to);
    save(); closeSheet(); render(); toast(isNew?"Phase added":"Phase saved");
  });
}

function finishSheet(){
  if(isDeload()){
    openSheet(`<h3>Finish block ${state.block}</h3>
      <p class="muted" style="font-size:15px">Retest your heavy lifts, then update your 1RMs in Setup. Starting the new block resets every Increase and Fall back adjustment to zero.</p>
      <div class="stack"><button class="btn primary block" data-act="confirmnewblock">Start block ${state.block+1}</button><button class="btn block" data-act="close">Not yet</button></div>`);
    return;
  }
  const changes = state.exercises.filter(e=>e.equip!=="bw").map(e=>{
    const a=curKg(e), b=nextKg(e); const tag=b>a?"delta up":b<a?"delta down":"delta";
    return `<li><span>${esc(e.name)}</span><span class="num ${tag}" style="font-size:17px">${fmt(a)} → ${fmt(b)}</span></li>`;
  }).join("");
  const next = state.week+1;
  openSheet(`<h3>Finish week ${state.week}</h3>
    <ul class="changes">${changes}</ul>
    <div class="stack"><button class="btn primary block" data-act="confirmfinish">Start week ${next}${next===5?" (deload)":""}</button><button class="btn block" data-act="close">Back</button></div>`);
}
function applyFinish(){
  const wk = state.block+"-"+state.week;
  state.exercises.forEach(e=>{
    if(e.equip==="bw") return;
    (state.history[e.id] = state.history[e.id]||[]).push({wk, kg:curKg(e)});
    e.offset = rnd(nextKg(e) - baseKg(e), 0.25);
    e.decision = "up";
  });
  state.week += 1;
  state.runWeek = Math.min(36, state.runWeek+1);
}
function newBlock(){
  state.block += 1; state.week = 1;
  state.exercises.forEach(e=>{ e.offset=0; e.decision="up"; });
  state.history = {};
}

/* ---------- events ---------- */
document.addEventListener("click", async ev=>{
  const b = ev.target.closest("button, .scrim");
  if(!b) return;
  if(b.classList.contains("scrim") && ev.target!==b) return;
  if(b.dataset.tab){ ui.tab=b.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(b.dataset.day!==undefined){ ui.day=parseInt(b.dataset.day); render(); return; }
  if(b.dataset.set!==undefined){
    const k=state.block+"-"+state.week; const L=(state.log[k]=state.log[k]||{}); const arr=(L[b.dataset.ex]=L[b.dataset.ex]||[]);
    const i=parseInt(b.dataset.set); arr[i]=((arr[i]||0)+1)%3;
    const e=state.exercises.find(x=>x.id===b.dataset.ex);
    if(arr[i]===2 && e && e.decision==="up") e.decision="hold";
    save(); render(); return;
  }
  if(b.dataset.dec){ const e=state.exercises.find(x=>x.id===b.dataset.ex); if(e){ e.decision=b.dataset.dec; save(); render(); } return; }
  if(b.dataset.step){
    const k=b.dataset.step; state[k]=Math.max(+b.dataset.min, Math.min(+b.dataset.max, state[k]+(+b.dataset.by)));
    save(); render(); return;
  }
  const act = b.dataset.act;
  if(!act) return;
  if(act==="close"){ closeSheet(); return; }
  if(act==="edit"){ const e=state.exercises.find(x=>x.id===b.dataset.ex); if(e) editSheet(JSON.parse(JSON.stringify(e)), false); return; }
  if(act==="add"){ editSheet({id:"x"+Date.now().toString(36), day:ui.day, name:"", sets:3, reps:"10", equip:"machine", base:{type:"fixed",kg:20}, inc:2.5, round:2.5, note:"", icon:"press", offset:0, decision:"up"}, true); return; }
  if(act==="delete"){ delete photos[b.dataset.ex]; savePhotos(); state.exercises=state.exercises.filter(x=>x.id!==b.dataset.ex); save(); closeSheet(); render(); toast("Exercise deleted"); return; }
  if(act==="resetoffset"){ const e=state.exercises.find(x=>x.id===b.dataset.ex); if(e){ e.offset=0; save(); closeSheet(); render(); toast("Adjustment reset"); } return; }
  if(act==="preview"){ previewSheet(b.dataset.ex); return; }
  if(act==="pickphoto"){ const i=document.getElementById("photoFile"); if(i) i.click(); return; }
  if(act==="rmphoto"){ delete photos[b.dataset.ex]; savePhotos(); previewSheet(b.dataset.ex); toast("Photo removed"); return; }
  if(act==="editrun"){ runSheet(parseInt(b.dataset.run), false); return; }
  if(act==="addrun"){ runSheet(-1, true); return; }
  if(act==="delrun"){ state.runs.splice(parseInt(b.dataset.run),1); save(); closeSheet(); render(); toast("Phase deleted"); return; }
  if(act==="rundone"){ const k=state.runWeek+"-"+ui.day; state.runLog[k]=!state.runLog[k]; save(); render(); return; }
  if(act==="finish"){ finishSheet(); return; }
  if(act==="confirmfinish"){ applyFinish(); save(); closeSheet(); render(); window.scrollTo(0,0); toast("Week "+state.week+" started"); return; }
  if(act==="newblock"){ openSheet(`<h3>Start a new block?</h3><p class="muted" style="font-size:15px">Goes back to week 1 and clears every Increase and Fall back adjustment. Update your 1RMs first if you retested.</p><div class="stack"><button class="btn primary block" data-act="confirmnewblock">Start new block</button><button class="btn block" data-act="close">Cancel</button></div>`); return; }
  if(act==="confirmnewblock"){ newBlock(); save(); closeSheet(); ui.tab="train"; render(); toast("Block "+state.block+" started"); return; }
  if(act==="reset"){ openSheet(`<h3>Reset everything?</h3><p class="muted" style="font-size:15px">Restores the original programme and deletes your logs and custom exercises.</p><div class="stack"><button class="btn danger block" data-act="confirmreset">Reset</button><button class="btn block" data-act="close">Cancel</button></div>`); return; }
  if(act==="confirmreset"){ state=defaults(); save(); closeSheet(); ui.tab="train"; render(); toast("Programme reset"); return; }
  if(act==="export"){
    const data = JSON.stringify(state,null,1); const name="lift-log-"+new Date().toISOString().slice(0,10)+".json";
    let dl=null; try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){}
    if(dl){ try{ await dl.save({filename:name, data}); toast("Backup saved"); }catch(e){ if(e && e.code!=="declined") toast("Export failed here"); } }
    else {
      try{
        const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
        a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast("Backup saved");
      }catch(e){ try{ await navigator.clipboard.writeText(data); toast("Backup copied to clipboard"); }catch(e2){ toast("Export not available here"); } }
    }
    return;
  }
  if(act==="import"){ document.getElementById("importFile").click(); return; }
});
document.addEventListener("change", ev=>{
  const t=ev.target;
  if(t.dataset.max){ const v=parseFloat(t.value); if(v>0){ state.maxes[t.dataset.max]=v; save(); } return; }
  if(t.dataset.daytype!==undefined){ state.dayTypes[+t.dataset.daytype]=t.value; save(); return; }
  if(t.id==="photoFile" && t.files && t.files[0]){
    const id=t.dataset.ex;
    shrink(t.files[0], data=>{ photos[id]=data; savePhotos(); previewSheet(id); toast("Photo saved"); });
    return;
  }
  if(t.id==="importFile" && t.files && t.files[0]){
    const r=new FileReader();
    r.onload=()=>{
      try{
        const s=JSON.parse(r.result);
        if(!s || !Array.isArray(s.exercises)) return toast("That file is not a Lift Log backup");
        // A shared template has exercises but no personal logs, so fill the gaps
        // from the defaults instead of rejecting it as an incomplete backup.
        const base=defaults();
        state=Object.assign(base, s, {
          v:1, exercises:s.exercises,
          maxes:Object.assign(base.maxes, s.maxes||{}),
          dayTypes:s.dayTypes||base.dayTypes,
          log:s.log||{}, history:s.history||{}, runLog:s.runLog||{},
          block:s.block||1, week:s.week||1, runWeek:s.runWeek||1
        });
        save(); ui.tab="train"; render(); toast(s.log?"Backup restored":"Programme imported");
      }catch(e){ toast("That file is not a Lift Log backup"); }
    };
    r.readAsText(t.files[0]);
  }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape" && overlay.innerHTML) closeSheet(); });

render();
initSync();
})();
</script>
</body>
</html>
